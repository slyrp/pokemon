<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 15L21 21M10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10C17 13.866 13.866 17 10 17Z" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="What yu lookin' for luh twan?"
                    autocomplete="off"
                >
                <button id="searchBtn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="14" viewBox="0 0 17 14" fill="none">
                        <path d="M1 6.83333H15.5833M15.5833 6.83333L9.75 1M15.5833 6.83333L9.75 12.6667" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                </button>
            </div>
        </header>
        
        <div id="loadingIndicator" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading Pokémon...</p>
        </div>
        
        <div id="pokemonGrid" class="pokemon-grid"></div>
        
        <div id="endMessage" class="end-message hidden">
            <p>You've caught them all! 🎉</p>
        </div>
        
        <div id="noResults" class="no-results hidden">
            <p>No Pokémon found. Try a different search!</p>
        </div>
        
        <div id="errorMessage" class="error-message hidden">
            <p>Something went wrong. Please try again later.</p>
        </div>
    </div>
    
    <!-- Pokemon Details Modal -->
    <div id="pokemonModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
